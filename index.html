<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple animated Todo app with browser LocalStorage.">
  <title>Aurora Todo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="orb orb-one"></span>
    <span class="orb orb-two"></span>
    <span class="orb orb-three"></span>
  </div>

  <main class="app-shell">
    <section class="todo-card" aria-label="Todo application">
      <header class="app-header">
        <div>
          <p class="eyebrow">PERSONAL PRODUCTIVITY</p>
          <h1>My Tasks<span class="title-dot">.</span></h1>
          <p class="subtitle">Keep it simple. Get things done.</p>
        </div>
        <div class="task-summary" aria-live="polite">
          <strong id="remainingCount">0</strong>
          <span>remaining</span>
        </div>
      </header>

      <form class="task-form" id="taskForm">
        <label class="sr-only" for="taskInput">Add a task</label>
        <input
          id="taskInput"
          type="text"
          maxlength="120"
          placeholder="What needs to be done?"
          autocomplete="off"
        >
        <div class="task-options">
          <label class="option-field">
            <span>Priority</span>
            <select id="priorityInput" aria-label="Task priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
          <label class="option-field">
            <span>Due date</span>
            <input id="dueDateInput" type="date" aria-label="Task due date">
          </label>
          <label class="option-field">
            <span>Status</span>
            <select id="progressInput" aria-label="Task progress">
              <option value="todo" selected>Not started</option>
              <option value="in-progress">In progress</option>
            </select>
          </label>
        </div>
        <button type="submit" class="add-btn">Add task</button>
      </form>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Task filters">
          <button type="button" class="filter-btn active" data-filter="all">All</button>
          <button type="button" class="filter-btn" data-filter="active">Active</button>
          <button type="button" class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <button type="button" class="clear-btn" id="clearCompleted">
          Clear completed
        </button>
      </div>

      <section class="task-section" aria-label="Tasks">
        <ul class="task-list" id="taskList"></ul>

        <div class="empty-state" id="emptyState">
          <div class="empty-icon">✓</div>
          <h2 id="emptyTitle">Nothing here yet</h2>
          <p id="emptyMessage">Add your first task and make today count.</p>
        </div>
      </section>

      <footer class="app-footer">
        <span id="taskStatus">0 tasks</span>
        <span class="storage-note">Saved automatically in this browser</span>
      </footer>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
